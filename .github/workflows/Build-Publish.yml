name: Build & Release .NET 11

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.displayName }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            displayName: Windows-x64
            os: windows-latest

          - runtime: linux-x64
            displayName: Linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Publish
        run: >
          dotnet publish S6Patcher.csproj
          -c Release
          -r ${{ matrix.runtime }}
          -o publish/${{ matrix.displayName }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:StripSymbols=true

      - name: Remove PDB files
        shell: bash
        run: |
          find publish/${{ matrix.displayName }} -name "*.pdb" -delete || true

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx --yes --no-progress

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends upx-ucl

      - name: Compress executable with UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: upx --best "publish/${{ matrix.displayName }}/S6Patcher.exe"

      - name: Compress executable with UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: upx-ucl --best "publish/${{ matrix.displayName }}/S6Patcher"

      - name: Include licenses
        shell: bash
        run: |
          mkdir -p "publish/${{ matrix.displayName }}/Licenses"
          cp Licenses/. "publish/${{ matrix.displayName }}/Licenses/"
          cp LICENSE.txt "publish/${{ matrix.displayName }}/Licenses/S6Patcher.txt"

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "publish/${{ matrix.displayName }}",
            "${{ matrix.displayName }}.zip",
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true
          )

      - name: Create ZIP (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd publish
          zip -9 -r "../${{ matrix.displayName }}.zip" "${{ matrix.displayName }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.displayName }}
          path: ${{ matrix.displayName }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          files: |
            artifacts/Windows-x64.zip
            artifacts/Linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}